<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Details for Event Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"></link>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-roboto">
    <nav class="bg-black shadow-md">
        <div class="container mx-auto px-4 py-2 flex justify-between items-center">
         <div class="flex items-center">
             <a href="index.html">
                 <img alt="Logo of the movie ticket booking website" class="h-10" src="image/logo.png"/>
             </a>
          <ul class="flex space-x-4 ml-6">
           <li>
            <a class="text-gray-100 hover:text-red-500" href="movies.html">
             Movies
            </a>
           </li>
           <li>
            <a class="text-gray-100 hover:text-red-500" href="events.html">
             Events
            </a>
           </li>
           <li>
            <a class="text-gray-100 hover:text-red-500" href="#">
             Plays
            </a>
           </li>
           <li>
            <a class="text-gray-100 hover:text-red-500" href="#">
             Sports
            </a>
           </li>
           <li>
            <a class="text-gray-100 hover:text-red-500" href="#">
             Activities
            </a>
           </li>
          </ul>
         </div>
         <div class="flex items-center space-x-4">
             <div>
                 <input type="text" placeholder="Search..." class="p-1 rounded-lg">
                 <button class="bg-red-500 text-white p-2 rounded-lg"><i class="fas fa-search"></i></button>
             </div>
          <a class="text-gray-100 hover:text-red-500" href="login.html">
           Login
          </a>
         </div>
        </div>
       </nav>
    <div class="container mx-auto p-4">
        <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-lg">
            <h2 class="text-2xl font-bold mb-4">Event Booking</h2>
            <form>
                <div class="mb-4">
                    <label for="name" class="block text-gray-700 font-medium mb-2">Full Name</label>
                    <input type="text" id="name" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your full name">
                </div>
                <div class="mb-4">
                    <label for="email" class="block text-gray-700 font-medium mb-2">Email Address</label>
                    <input type="email" id="email" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your email address">
                </div>
                <div class="mb-4">
                    <label for="phone" class="block text-gray-700 font-medium mb-2">Phone Number</label>
                    <input type="tel" id="phone" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your phone number">
                </div>
                <div class="mb-4">
                    <label for="event" class="block text-gray-700 font-medium mb-2">Event</label>
                    <select id="event" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="event1">Event 1</option>
                        <option value="event2">Event 2</option>
                        <option value="event3">Event 3</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label for="date" class="block text-gray-700 font-medium mb-2">Event Date</label>
                    <input type="date" id="date" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-4">
                    <label for="comments" class="block text-gray-700 font-medium mb-2">Additional Comments</label>
                    <textarea id="comments" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" rows="4" placeholder="Enter any additional comments"></textarea>
                </div>
                <div class="flex justify-end">
                    <button type="submit" class="px-6 py-2 bg-blue-500 text-white font-medium rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">Submit</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
