<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Options for Booking Ticket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"></link>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        function showPaymentForm(paymentMethod) {
            const forms = document.querySelectorAll('.payment-form');
            forms.forEach(form => form.classList.add('hidden'));
            document.getElementById(paymentMethod).classList.remove('hidden');
        }
    </script>
</head>
<body class="bg-gray-100 font-roboto">
    <div class="container mx-auto p-4">
        <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-lg">
            <h2 class="text-2xl font-bold mb-4">Choose a Payment Method</h2>
            <div class="mb-4">
                <select onchange="showPaymentForm(this.value)" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">Select Payment Method</option>
                    <option value="cardForm">Credit/Debit Card</option>
                    <option value="paypalForm">PayPal</option>
                    <option value="bankForm">Bank Transfer</option>
                    <option value="upiForm">UPI</option>
                </select>
            </div>

            <!-- Credit/Debit Card Payment Form -->
            <div id="cardForm" class="payment-form hidden">
                <h3 class="text-xl font-semibold mb-2">Credit/Debit Card</h3>
                <form>
                    <div class="mb-4">
                        <label for="cardName" class="block text-gray-700 font-medium mb-2">Cardholder Name</label>
                        <input type="text" id="cardName" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter cardholder name">
                    </div>
                    <div class="mb-4">
                        <label for="cardNumber" class="block text-gray-700 font-medium mb-2">Card Number</label>
                        <input type="text" id="cardNumber" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter card number">
                    </div>
                    <div class="mb-4">
                        <label for="expiryDate" class="block text-gray-700 font-medium mb-2">Expiry Date</label>
                        <input type="text" id="expiryDate" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="MM/YY">
                    </div>
                    <div class="mb-4">
                        <label for="cvv" class="block text-gray-700 font-medium mb-2">CVV</label>
                        <input type="text" id="cvv" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter CVV">
                    </div>
                    <div class="flex justify-end">
                        <button type="submit" class="px-6 py-2 bg-blue-500 text-white font-medium rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">Pay Now</button>
                    </div>
                </form>
            </div>

            <!-- PayPal Payment Form -->
            <div id="paypalForm" class="payment-form hidden">
                <h3 class="text-xl font-semibold mb-2">PayPal</h3>
                <form>
                    <div class="mb-4">
                        <label for="paypalEmail" class="block text-gray-700 font-medium mb-2">PayPal Email</label>
                        <input type="email" id="paypalEmail" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter PayPal email">
                    </div>
                    <div class="flex justify-end">
                        <button type="submit" class="px-6 py-2 bg-blue-500 text-white font-medium rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">Pay with PayPal</button>
                    </div>
                </form>
            </div>

            <!-- Bank Transfer Payment Form -->
            <div id="bankForm" class="payment-form hidden">
                <h3 class="text-xl font-semibold mb-2">Bank Transfer</h3>
                <form>
                    <div class="mb-4">
                        <label for="accountName" class="block text-gray-700 font-medium mb-2">Account Holder Name</label>
                        <input type="text" id="accountName" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter account holder name">
                    </div>
                    <div class="mb-4">
                        <label for="accountNumber" class="block text-gray-700 font-medium mb-2">Account Number</label>
                        <input type="text" id="accountNumber" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter account number">
                    </div>
                    <div class="mb-4">
                        <label for="bankName" class="block text-gray-700 font-medium mb-2">Bank Name</label>
                        <input type="text" id="bankName" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter bank name">
                    </div>
                    <div class="mb-4">
                        <label for="ifsc" class="block text-gray-700 font-medium mb-2">IFSC Code</label>
                        <input type="text" id="ifsc" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter IFSC code">
                    </div>
                    <div class="flex justify-end">
                        <button type="submit" class="px-6 py-2 bg-blue-500 text-white font-medium rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">Pay via Bank Transfer</button>
                    </div>
                </form>
            </div>

            <!-- UPI Payment Form -->
            <div id="upiForm" class="payment-form hidden">
                <h3 class="text-xl font-semibold mb-2">UPI</h3>
                <form>
                    <div class="mb-4">
                        <label for="upiId" class="block text-gray-700 font-medium mb-2">UPI ID</label>
                        <input type="text" id="upiId" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter UPI ID">
                    </div>
                    <div class="flex justify-end">
                        <button type="submit" class="px-6 py-2 bg-blue-500 text-white font-medium rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">Pay via UPI</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
