<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Showtime Selection</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet"/>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #242333;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: #242333;
            border-radius: 12px;
            box-shadow: 0 2px 20px rgba(356, 86, 96, 0.1);
            overflow: hidden;
        }

        .movie-header {
            padding: 24px;
            background: #1a1a1a;
            color: white;
        }

        .movie-title {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .movie-meta {
            color: #aaa;
            font-size: 14px;
            display: flex;
            gap: 16px;
        }

        .date-selector {
            display: flex;
            overflow-x: auto;
            padding: 16px;
            background-color: #242333;
            gap: 12px;
        }

        .date-card {
            min-width: 80px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .date-card.selected {
            border-color: #4CAF50;
            background: #4CAF50;
            color: white;
        }

        .date-card:hover:not(.selected) {
            border-color: #4CAF50;
        }

        .date-card .day {
            font-size: 14px;
            margin-bottom: 4px;
            color: rgb(255, 255, 255);
        }

        .date-card .date {
            font-size: 18px;
            font-weight: bold;
            color: white;
        }

        .show-times {
            padding: 24px;
        }

        .cinema-section {
            margin-bottom: 32px;
        }

        .cinema-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .cinema-name {
            font-size: 18px;
            font-weight: bold;
            color: white;
        }

        .cinema-info {
            color: #8e8888;
            font-size: 14px;
        }

        .time{
            color: white;
        }

        .price{
            color: #8e8888;
        }

        .time-slots {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .time-slot {
            padding: 12px 20px;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .time-slot:hover {
            border-color: #4CAF50;
            background: #4CAF50;
        }

        .time-slot.selected {
            background: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }

        .time-slot .price {
            font-size: 12px;
            color: #ffffff;
            margin-top: 4px;
        }

        .time-slot.selected .price {
            color: #fff;
        }

        .format-tag {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff9800;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }

        .continue-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 32px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
        }

        .continue-btn.visible {
            display: block;
        }

        .continue-btn:hover {
            background: #45a049;
        }

        @media (max-width: 768px) {
            .date-selector {
                padding: 12px;
            }

            .time-slots {
                gap: 8px;
            }

            .time-slot {
                padding: 10px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="date-selector" id="dateSelector">
            <!-- Dates will be populated by JavaScript -->
        </div>

        <div class="show-times">
            <!-- Show times will be populated by JavaScript -->
        </div>
    </div>
    
    <a href="booking.html">
    <button class="continue-btn" id="continueBtn">
        Continue to Seat Selection
    </button>
    </a>

    <script>
        const cinemas = [
            {
                name: "AMC Premium Cinema",
                location: "Downtown Mall",
                distance: "2.5 miles away",
                amenities: ["Dolby Atmos", "IMAX", "Recliner Seats"],
                shows: [
                    { time: "10:30 AM", price: 12.99, format: "2D" },
                    { time: "1:45 PM", price: 15.99, format: "IMAX" },
                    { time: "4:30 PM", price: 12.99, format: "2D" },
                    { time: "7:15 PM", price: 15.99, format: "IMAX" },
                    { time: "10:00 PM", price: 12.99, format: "2D" }
                ]
            },
            {
                name: "Regal Cinemas",
                location: "Westfield Plaza",
                distance: "3.8 miles away",
                amenities: ["4K Projection", "Dolby Sound"],
                shows: [
                    { time: "11:00 AM", price: 10.99, format: "2D" },
                    { time: "2:15 PM", price: 10.99, format: "2D" },
                    { time: "5:00 PM", price: 13.99, format: "3D" },
                    { time: "7:45 PM", price: 10.99, format: "2D" },
                    { time: "10:30 PM", price: 13.99, format: "3D" }
                ]
            }
        ];

        let selectedDate = null;
        let selectedShow = null;

        function generateDates() {
            const dateSelector = document.getElementById('dateSelector');
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            
            for (let i = 0; i < 7; i++) {
                const date = new Date();
                date.setDate(date.getDate() + i);
                
                const dateCard = document.createElement('div');
                dateCard.className = 'date-card';
                dateCard.innerHTML = `
                    <div class="day">${days[date.getDay()]}</div>
                    <div class="date">${date.getDate()}</div>
                `;

                if (i === 0) {
                    dateCard.classList.add('selected');
                    selectedDate = date;
                }

                dateCard.addEventListener('click', () => {
                    document.querySelectorAll('.date-card').forEach(card => {
                        card.classList.remove('selected');
                    });
                    dateCard.classList.add('selected');
                    selectedDate = date;
                    updateShowTimes();
                });

                dateSelector.appendChild(dateCard);
            }
        }

        function updateShowTimes() {
            const showTimesContainer = document.querySelector('.show-times');
            showTimesContainer.innerHTML = '';

            cinemas.forEach(cinema => {
                const cinemaSection = document.createElement('div');
                cinemaSection.className = 'cinema-section';
                cinemaSection.innerHTML = `
                    <div class="cinema-header">
                        <div>
                            <div class="cinema-name">${cinema.name}</div>
                            <div class="cinema-info">
                                ${cinema.location} • ${cinema.distance}
                                <br>
                                ${cinema.amenities.join(' • ')}
                            </div>
                        </div>
                    </div>
                    <div class="time-slots">
                        ${cinema.shows.map(show => `
                            <div class="time-slot" data-cinema="${cinema.name}" data-time="${show.time}">
                                ${show.format !== "2D" ? `<span class="format-tag">${show.format}</span>` : ''}
                                <div class="time">${show.time}</div>
                                <div class="price">$${show.price}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
                showTimesContainer.appendChild(cinemaSection);
            });

            // Add click handlers to time slots
            document.querySelectorAll('.time-slot').forEach(slot => {
                slot.addEventListener('click', () => {
                    document.querySelectorAll('.time-slot').forEach(s => {
                        s.classList.remove('selected');
                    });
                    slot.classList.add('selected');
                    selectedShow = {
                        cinema: slot.dataset.cinema,
                        time: slot.dataset.time,
                        date: selectedDate
                    };
                    document.getElementById('continueBtn').classList.add('visible');
                });
            });
        }

        // Initialize the page
        generateDates();
        updateShowTimes();

        // Add click handler for continue button
        document.getElementById('continueBtn').addEventListener('click', () => {
            if (selectedShow) {
                const dateString = selectedShow.date.toLocaleDateString();
                alert(`Selected show:
                    Cinema: ${selectedShow.cinema}
                    Date: ${dateString}
                    Time: ${selectedShow.time}
                    
                    Proceeding to seat selection...`);
            }
        });
    </script>
</body>
</html>
