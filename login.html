<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In & Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(to right, #141E30, #243B55);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(0, 0, 0, 0.8);
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            width: 350px;
            text-align: center;
            transition: transform 0.3s ease-in-out;
        }
        .container:hover {
            transform: scale(1.05);
        }
        h2 {
            margin-bottom: 1rem;
        }
        .input-field {
            width: 93%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background: #21262d;
            color: white;
            font-size: 16px;
            transition: background 0.3s;
        }
        .input-field:focus {
            background: #2c313a;
            outline: none;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #00c6ff;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 18px;
            transition: 0.3s;
        }
        .btn:hover {
            background: #0072ff;
        }
        .toggle-link {
            display: block;
            margin: 15px 0;
            color: #58a6ff;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container" id="form-container">
        <h2 id="form-title">Sign In</h2>
        <input type="text" id="name" class="input-field" placeholder="Full Name" style="display: none;">
        <input type="email" id="email" class="input-field" placeholder="Email" required>
        <input type="password" id="password" class="input-field" placeholder="Password" required>
        <input type="password" id="confirm-password" class="input-field" placeholder="Confirm Password" style="display: none;">
        <button class="btn" id="submit-btn" onclick="handleSubmit()">Sign In</button>
        <a class="toggle-link" onclick="toggleForm()">Don't have an account? Sign up</a>
    </div>

    <script>
        let isSignUp = false;

        function toggleForm() {
            isSignUp = !isSignUp;
            document.getElementById('form-title').innerText = isSignUp ? 'Sign Up' : 'Sign In';
            document.getElementById('name').style.display = isSignUp ? 'block' : 'none';
            document.getElementById('confirm-password').style.display = isSignUp ? 'block' : 'none';
            document.getElementById('submit-btn').innerText = isSignUp ? 'Sign Up' : 'Sign In';
            document.querySelector('.toggle-link').innerText = isSignUp ? 'Already have an account? Sign in' : 'Don\'t have an account? Sign up';
        }

        function handleSubmit() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (isSignUp) {
                const name = document.getElementById('name').value;
                const confirmPassword = document.getElementById('confirm-password').value;

                if (!name || !email || !password || !confirmPassword) {
                    alert('Please fill in all fields.');
                    return;
                }

                if (password !== confirmPassword) {
                    alert('Passwords do not match.');
                    return;
                }
                alert(`Account created successfully for ${name}!`);
            } else {
                if (!email || !password) {
                    alert('Please enter both email and password.');
                    return;
                }
                alert(`Welcome back, ${email}!`);
            }
        }
    </script>
</body>
</html>
