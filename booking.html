<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Seat Booking</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #242333;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .movie-container {
            margin: 20px 0;
            width: 100%;
            max-width: 800px;
        }

        .movie-container select {
            background-color: #ffffff;
            border: 0;
            border-radius: 5px;
            font-size: 16px;
            padding: 12px;
            width: 100%;
            appearance: none;
            -moz-appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .movie-info {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .movie-details {
            flex: 1;
        }

        .movie-title {
            font-size: 1.2em;
            margin-bottom: 5px;
        }

        .movie-metadata {
            color: #aaa;
            font-size: 0.9em;
        }

        .container {
            perspective: 1000px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 800px;
        }

        .screen {
            background-color: #fff;
            height: 70px;
            width: 100%;
            margin: 15px 0;
            transform: rotateX(-45deg);
            box-shadow: 0 3px 10px rgba(255, 255, 255, 0.7);
        }

        .screen-text {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .seat-demo {
            width: 24px;
            height: 24px;
            border-radius: 8px;
        }

        .seating {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 30px;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .row-label {
            width: 24px;
            text-align: center;
            font-weight: bold;
            color: #aaa;
        }

        .seats {
            display: flex;
            gap: 8px;
            flex: 1;
            justify-content: center;
        }

        .seat {
            width: 24px;
            height: 24px;
            border-radius: 8px;
            background-color: #444451;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .seat:not(.occupied):hover {
            transform: scale(1.2);
            background-color: #66bb6a;
        }

        .seat.selected {
            background-color: #4CAF50;
        }

        .seat.occupied {
            background-color: #fff;
            cursor: not-allowed;
        }

        .seat.vip {
            border: 2px solid #ffd700;
        }

        .summary {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 5px;
            width: 100%;
            max-width: 800px;
        }

        .selected-seats {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 15px;
        }

        .seat-badge {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
        }

        .total {
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        .continue-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: background-color 0.3s;
        }

        .continue-btn:disabled {
            background-color: #444451;
            cursor: not-allowed;
        }

        .continue-btn:not(:disabled):hover {
            background-color: #45a049;
        }

        .timer {
            text-align: center;
            color: #ff4444;
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .movie-info {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }

            .selected-seats {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="movie-container">
        <select id="movie">
            <option value="10">Avengers: Endgame ($10)</option>
            <option value="12">The Batman ($12)</option>
            <option value="8">Spider-Man: No Way Home ($8)</option>
            <option value="15">Oppenheimer ($15)</option>
        </select>

        <div class="movie-info">
            <div class="movie-details">
                <div id="movieTitle" class="movie-title">Avengers: Endgame</div>
                <div class="movie-metadata">
                    <span id="movieTime">3h 2min</span> | 
                    <span id="movieRating">PG-13</span> |
                    <span id="movieGenre">Action, Adventure, Drama</span>
                </div>
            </div>
            <div id="movieShowtime">Today, 7:30 PM</div>
        </div>
    </div>

    <div class="container">
        <div class="screen"></div>
        <p class="screen-text">Screen</p>

        <div class="legend">
            <div class="legend-item">
                <div class="seat seat-demo"></div>
                <span>Available</span>
            </div>
            <div class="legend-item">
                <div class="seat seat-demo occupied"></div>
                <span>Occupied</span>
            </div>
            <div class="legend-item">
                <div class="seat seat-demo selected"></div>
                <span>Selected</span>
            </div>
            <div class="legend-item">
                <div class="seat seat-demo vip"></div>
                <span>VIP (+$5)</span>
            </div>
        </div>

        <div class="seating" id="seating"></div>
    </div>

    <div class="summary">
        <div class="timer" id="timer">Time remaining: 5:00</div>
        <div class="selected-seats">
            <span>Selected Seats:</span>
            <div id="selectedSeatsDisplay"></div>
        </div>
        <div class="total" id="totalPrice">Total: $0.00</div>
        <a href="payment.html"><button class="continue-btn" id="continueBtn" disabled>Continue to Payment</button></a>
    </div>

    <script>
        const movieData = {
            "Avengers: Endgame": {
                time: "3h 2min",
                rating: "PG-13",
                genre: "Action, Adventure, Drama",
                price: 10
            },
            "The Batman": {
                time: "2h 56min",
                rating: "PG-13",
                genre: "Action, Crime, Drama",
                price: 12
            },
            "Spider-Man: No Way Home": {
                time: "2h 28min",
                rating: "PG-13",
                genre: "Action, Adventure, Fantasy",
                price: 8
            },
            "Oppenheimer": {
                time: "3h",
                rating: "R",
                genre: "Biography, Drama, History",
                price: 15
            }
        };

        const rows = 8;
        const seatsPerRow = 10;
        let selectedSeats = [];
        let timeLeft = 300; // 5 minutes in seconds

        // VIP rows (middle rows)
        const vipRows = ['D', 'E'];

        // Generate random occupied seats
        const occupiedSeats = Array.from({length: 15}, () => {
            const row = String.fromCharCode(65 + Math.floor(Math.random() * rows));
            const seat = Math.floor(Math.random() * seatsPerRow) + 1;
            return `${row}${seat}`;
        });

        function getRowLabel(index) {
            return String.fromCharCode(65 + index);
        }

        function updateMovieInfo() {
            const select = document.getElementById('movie');
            const movieTitle = select.options[select.selectedIndex].text.split(' ($')[0];
            const data = movieData[movieTitle];

            document.getElementById('movieTitle').textContent = movieTitle;
            document.getElementById('movieTime').textContent = data.time;
            document.getElementById('movieRating').textContent = data.rating;
            document.getElementById('movieGenre').textContent = data.genre;
            
            // Update showtime to be 30 minutes from now
            const now = new Date();
            now.setMinutes(now.getMinutes() + 30);
            const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            document.getElementById('movieShowtime').textContent = `Today, ${timeString}`;

            updateSummary();
        }

        function createSeating() {
            const seatingContainer = document.getElementById('seating');
            seatingContainer.innerHTML = '';

            for (let i = 0; i < rows; i++) {
                const row = document.createElement('div');
                row.className = 'row';

                const rowLabel = document.createElement('div');
                rowLabel.className = 'row-label';
                rowLabel.textContent = getRowLabel(i);
                row.appendChild(rowLabel);

                const seats = document.createElement('div');
                seats.className = 'seats';

                for (let j = 0; j < seatsPerRow; j++) {
                    const seat = document.createElement('div');
                    const seatId = `${getRowLabel(i)}${j + 1}`;
                    const isVip = vipRows.includes(getRowLabel(i));
                    
                    seat.className = `seat ${occupiedSeats.includes(seatId) ? 'occupied' : ''} ${isVip ? 'vip' : ''}`;
                    seat.textContent = j + 1;
                    seat.dataset.seatId = seatId;
                    seat.dataset.isVip = isVip;

                    if (!occupiedSeats.includes(seatId)) {
                        seat.addEventListener('click', () => toggleSeat(seatId, seat));
                    }

                    seats.appendChild(seat);
                }

                row.appendChild(seats);
                seatingContainer.appendChild(row);
            }
        }

        function toggleSeat(seatId, seatElement) {
            const index = selectedSeats.indexOf(seatId);
            if (index === -1) {
                selectedSeats.push(seatId);
                seatElement.classList.add('selected');
            } else {
                selectedSeats.splice(index, 1);
                seatElement.classList.remove('selected');
            }
            updateSummary();
        }

        function updateSummary() {
            const movieSelect = document.getElementById('movie');
            const basePrice = parseInt(movieSelect.value);
            const selectedSeatsDisplay = document.getElementById('selectedSeatsDisplay');
            const totalPrice = document.getElementById('totalPrice');
            const continueBtn = document.getElementById('continueBtn');

            selectedSeatsDisplay.innerHTML = '';
            
            let total = 0;
            if (selectedSeats.length > 0) {
                selectedSeats.sort().forEach(seatId => {
                    const badge = document.createElement('div');
                    badge.className = 'seat-badge';
                    badge.textContent = seatId;
                    selectedSeatsDisplay.appendChild(badge);

                    // Add VIP premium if applicable
                    const isVip = vipRows.includes(seatId[0]);
                    total += basePrice + (isVip ? 5 : 0);
                });
            } else {
                const span = document.createElement('span');
                span.style.color = '#666';
                span.textContent = 'None selected';
                selectedSeatsDisplay.appendChild(span);
            }

            totalPrice.textContent = `Total: $${total.toFixed(2)}`;
            continueBtn.disabled = selectedSeats.length === 0;
        }

        function updateTimer() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timer').textContent = 
                `Time remaining: ${minutes}:${seconds.toString().padStart(2, '0')}`;

            if (timeLeft === 0) {
                alert('Booking session expired! Please start over.');
                window.location.reload();
            } else {
                timeLeft--;
            }
        }

        // Initialize
        createSeating();
        updateMovieInfo();
        setInterval(updateTimer, 1000);

        // Event Listeners
        document.getElementById('movie').addEventListener('change', updateMovieInfo);
        document.getElementById('continueBtn').addEventListener('click', () => {
            const movieSelect = document.getElementById('movie');
            const movieTitle = movieSelect.options[movieSelect.selectedIndex].text.split(' ($')[0];
            alert(`Proceeding to payment for "${movieTitle}" with seats: ${selectedSeats.join(', ')}`);
        });
    </script>
</body>
</html>
